name: Build COG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build COG APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare COG Project
        run: |
          mkdir -p extracted

          echo "Isi repository:"
          ls -la

          if [ -f "./cog" ]; then
            echo "File cog ditemukan."

            if unzip -t "./cog" >/dev/null 2>&1; then
              echo "cog adalah ZIP. Mengekstrak..."
              unzip -q "./cog" -d extracted
            else
              echo "cog bukan ZIP."
            fi
          fi

          if [ -f "./cog.zip" ]; then
            echo "cog.zip ditemukan. Mengekstrak..."
            unzip -q "./cog.zip" -d extracted
          fi

          echo "Mencari settings.gradle..."
          find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print

      - name: Find Android Project
        run: |
          SETTINGS=$(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -not -path "./.git/*" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Project Android belum ditemukan."
            echo ""
            echo "File repository:"
            find . -maxdepth 5 -type f -not -path "./.git/*" -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "================================"
          echo "PROJECT COG DITEMUKAN:"
          echo "$PROJECT_DIR"
          echo "================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload COG APK
        uses: actions/upload-artifact@v4
        with:
          name: COG-Floating-Crosshair-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
